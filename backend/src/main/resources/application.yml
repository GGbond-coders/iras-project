server:
  port: 8080
  servlet:
    context-path: /iras

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/iras?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.iras.entity
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  secret: IRAS-Secret-Key-For-JWT-Token-Generation-2024-Long-Enough-For-HS512
  expiration: 86400000  # 24小时

# Dify API 配置
dify:
  base-url: https://api.dify.ai/v1
  job-profile-key: app-1S7R9zv0wEmZDKpk5uB4IXcB

  resume-diagnosis-key: app-eAFPOpKqhM1WKEObg8HZJOY1

logging:
  level:
    com.iras: debug
